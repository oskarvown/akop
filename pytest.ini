[pytest]
asyncio_mode = auto
asyncio_default_fixture_loop_scope = function
addopts = -m "not e2e and not alembic_migration"
markers =
    integration: tests requiring a live PostgreSQL instance (see tests/integration/conftest.py)
    e2e: end-to-end tests requiring local Excel fixtures in ~/Downloads and private_inputs/synthetic_e2e
    alembic_migration: schema upgrade/downgrade tests that mutate alembic_version; run serially, not in parallel with other DB tests
